<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EmmettTV – Free live TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--neon:#18d8ff;--blue:#2a7bff;--text:#eaf3ff;--dim:#8da6d6;--glass:rgba(16,40,100,.28);--edge:rgba(130,205,255,.2)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;color:var(--text);font-family:Manrope,system-ui,sans-serif;background:#02050d;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(110px);z-index:-1;pointer-events:none}
body::before{width:620px;height:620px;background:#1457ff;opacity:.45;top:-160px;left:-120px}
body::after{width:560px;height:560px;background:#00c8ff;opacity:.28;bottom:-180px;right:-120px}
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--edge);box-shadow:0 8px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
header{position:sticky;top:12px;z-index:20;margin:12px auto 0;max-width:1400px;width:calc(100% - 32px);border-radius:18px;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font:800 22px Unbounded;color:#fff;text-shadow:0 0 16px var(--neon)}
.logo b{color:var(--neon)}
.sp{flex:1}
input,select{background:rgba(255,255,255,.07);border:1px solid var(--edge);color:var(--text);padding:10px 16px;border-radius:999px;font:600 14px Manrope;outline:none}
input{width:min(320px,100%)}select option{background:#07122e}
input:focus,select:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(24,216,255,.25)}
#count{color:var(--dim);font-size:13px}
.wrap{max-width:1400px;margin:0 auto;padding:16px}
#chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--dim);padding:8px 16px;border-radius:999px;font:700 13px Manrope;cursor:pointer;transition:.15s;text-transform:capitalize}
.chip:hover{color:#fff;background:rgba(255,255,255,.12)}
.chip.on{color:#00131c;background:var(--neon);border-color:var(--neon);box-shadow:0 0 18px rgba(24,216,255,.6)}
#player{border-radius:22px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
#screen{position:relative;aspect-ratio:16/9;max-height:68vh;width:100%;margin:0 auto;border-radius:14px;overflow:hidden;background:rgba(0,0,0,.7);border:1px solid var(--edge)}
video{position:absolute;inset:0;width:100%;height:100%;background:#000}
#msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:linear-gradient(135deg,rgba(10,40,120,.55),rgba(0,0,0,.7));backdrop-filter:blur(8px);z-index:2}
#msg[hidden]{display:none}
#msg h2{font:800 clamp(18px,3vw,28px) Unbounded;margin-bottom:8px}
#msg p{color:var(--dim);margin-bottom:16px}
.btn{border:1px solid var(--edge);background:rgba(255,255,255,.09);color:#fff;padding:10px 20px;border-radius:12px;font:700 14px Manrope;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--neon);box-shadow:0 0 16px rgba(24,216,255,.4)}
.btn.pri{background:linear-gradient(135deg,var(--blue),var(--neon));color:#00131c;border:0}
#bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 4px}
#bar h1{font:800 20px Unbounded;flex:1;min-width:180px}
#bar small{display:block;font:600 13px Manrope;color:var(--dim);margin-top:4px}
h3{font:600 16px Unbounded;margin:26px 4px 14px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px}
.card{position:relative;border-radius:16px;padding:10px;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);border-color:var(--neon);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 20px rgba(24,216,255,.35)}
.card.on{border-color:var(--neon);box-shadow:0 0 24px rgba(24,216,255,.55)}
.thumb{aspect-ratio:16/10;border-radius:10px;background:rgba(0,0,0,.45);display:grid;place-items:center;overflow:hidden;font:800 28px Unbounded;color:var(--neon)}
.thumb img{width:82%;height:82%;object-fit:contain}
.card b{display:block;margin-top:9px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{font-size:12px;color:var(--dim);text-transform:capitalize}
.fav{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:1px solid var(--edge);background:rgba(2,8,24,.6);backdrop-filter:blur(6px);color:var(--dim);cursor:pointer;font-size:15px}
.fav.on{color:var(--neon);border-color:var(--neon)}
#more{display:block;margin:22px auto}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:40px}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="glass">
  <div class="logo">Emmett<b>TV</b></div>
  <input id="q" type="search" placeholder="Search channels" aria-label="Search channels">
  <select id="country" aria-label="Country"><option value="">All countries</option></select>
  <div class="sp"></div>
  <span id="count">Loading channels…</span>
</header>

<div class="wrap">
  <div id="chips"></div>
  <section id="player" class="glass">
    <div id="screen">
      <div id="msg"><div>
        <h2 id="mh">Welcome to EmmettTV</h2>
        <p id="mp">Thousands of free channels. No login, no sign-up.</p>
        <button class="btn pri" id="go">Surprise me</button>
      </div></div>
      <video id="v" playsinline controls></video>
    </div>
    <div id="bar">
      <h1><span id="title">Pick a channel</span><small id="sub">Choose anything from the grid below.</small></h1>
      <button class="btn" id="prev">Previous</button>
      <button class="btn" id="next">Next</button>
      <button class="btn" id="fs">Fullscreen</button>
    </div>
  </section>
  <h3 id="gh">All channels</h3>
  <div id="grid"></div>
  <button class="btn" id="more" hidden>Show more</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
// All channels come from the public iptv-org playlists (free-to-air / publicly available streams).
const CATS = ['animation','auto','business','classic','comedy','cooking','culture','documentary','education','entertainment','family','general','kids','legislative','lifestyle','movies','music','news','outdoor','public','relax','religious','science','series','shop','sports','travel','weather'];
const PAGE = 72;
let channels = [], seen = new Set(), cat = 'all', country = '', query = '', shown = PAGE, cur = null, hls = null, loadedCount = 0;
let favs = []; try { favs = JSON.parse(localStorage.getItem('etv_favs') || '[]'); } catch (e) {}
const $ = id => document.getElementById(id), v = $('v');
let names; try { names = new Intl.DisplayNames(['en'], { type: 'region' }); } catch (e) {}
const cname = c => { try { return names ? names.of(c.toUpperCase()) : c.toUpperCase(); } catch (e) { return c.toUpperCase(); } };

function parseM3U(txt, category) {
  const lines = txt.split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    if (!lines[i].startsWith('#EXTINF')) continue;
    // Streams that need a custom user-agent or referrer can't be played from a browser, so skip them.
    if (/http-(user-agent|referrer)=/i.test(lines[i])) continue;
    let url = '';
    for (let j = i + 1; j < lines.length; j++) { if (lines[j] && !lines[j].startsWith('#')) { url = lines[j].trim(); break; } }
    if (!/^https?:/.test(url) || seen.has(url)) continue;
    if (location.protocol === 'https:' && url.startsWith('http:')) continue;
    seen.add(url);
    const name = lines[i].replace(/^#EXTINF:\S*\s*/, '').replace(/[\w-]+="[^"]*"\s*/g, '').replace(/^\s*,/, '').trim().replace(/\s*\(\d+p\)|\s*\[[^\]]*\]/g, '') || 'Channel';
    const logo = (lines[i].match(/tvg-logo="([^"]*)"/) || [])[1] || '';
    const cc = ((lines[i].match(/tvg-id="[^"]*\.([a-z]{2})(?:@[^"]*)?"/i) || [])[1] || '').toLowerCase();
    channels.push({ url, name, logo, cat: category, cc });
  }
}
let rt; function later() { clearTimeout(rt); rt = setTimeout(() => { buildCountries(); render(); }, 200); }
CATS.forEach(c => fetch(`https://iptv-org.github.io/iptv/categories/${c}.m3u`)
  .then(r => r.ok ? r.text() : '').then(t => { parseM3U(t, c); })
  .catch(() => {}).finally(() => { loadedCount++; $('count').textContent = loadedCount < CATS.length ? `Loading… ${channels.length} channels` : `${channels.length.toLocaleString()} channels`; later(); }));

function buildCountries() {
  const codes = [...new Set(channels.map(c => c.cc).filter(Boolean))].sort((a, b) => cname(a).localeCompare(cname(b)));
  const sel = $('country'), keep = sel.value;
  sel.innerHTML = '<option value="">All countries</option>' + codes.map(c => `<option value="${c}">${cname(c)}</option>`).join('');
  sel.value = keep;
}
function visible() {
  return channels.filter(c => (cat === 'all' || (cat === 'favorites' ? favs.includes(c.url) : c.cat === cat)) && (!country || c.cc === country) && c.name.toLowerCase().includes(query))
    .sort((a, b) => !!b.logo - !!a.logo);
}
function renderChips() {
  $('chips').innerHTML = '';
  ['all', 'favorites', ...CATS].forEach(c => {
    const b = document.createElement('button'); b.className = 'chip' + (c === cat ? ' on' : ''); b.textContent = c;
    b.onclick = () => { cat = c; shown = PAGE; render(); }; $('chips').appendChild(b);
  });
}
function render() {
  renderChips();
  const list = visible(), g = $('grid'); g.innerHTML = '';
  $('gh').textContent = (cat === 'all' ? 'All channels' : cat[0].toUpperCase() + cat.slice(1)) + ` (${list.length.toLocaleString()})`;
  if (!list.length) g.innerHTML = '<div class="empty">' + (cat === 'favorites' ? 'Tap the star on a channel to save it here.' : loadedCount < CATS.length ? 'Loading channels…' : 'No channels match.') + '</div>';
  list.slice(0, shown).forEach(c => {
    const d = document.createElement('div'); d.className = 'card glass' + (cur && cur.url === c.url ? ' on' : ''); d.tabIndex = 0;
    const t = document.createElement('div'); t.className = 'thumb';
    if (c.logo) { const im = new Image(); im.src = c.logo; im.alt = ''; im.loading = 'lazy'; im.referrerPolicy = 'no-referrer'; im.onerror = () => { im.remove(); t.textContent = c.name[0]; }; t.appendChild(im); } else t.textContent = c.name[0];
    const b = document.createElement('b'); b.textContent = c.name;
    const s = document.createElement('span'); s.textContent = c.cat + (c.cc ? ' · ' + cname(c.cc) : '');
    const f = document.createElement('button'); f.className = 'fav' + (favs.includes(c.url) ? ' on' : ''); f.textContent = '★'; f.setAttribute('aria-label', 'Favorite ' + c.name);
    f.onclick = e => { e.stopPropagation(); favs = favs.includes(c.url) ? favs.filter(x => x !== c.url) : [...favs, c.url]; try { localStorage.setItem('etv_favs', JSON.stringify(favs)); } catch (e) {} render(); };
    d.append(t, b, s, f);
    d.onclick = () => { play(c); $('player').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    d.onkeydown = e => { if (e.key === 'Enter') d.onclick(); };
    g.appendChild(d);
  });
  $('more').hidden = list.length <= shown;
}

function msg(h, p, btn, fn) {
  $('mh').textContent = h; $('mp').textContent = p; $('go').textContent = btn; $('go').onclick = fn; $('msg').hidden = false;
}
function stop() { if (hls) { hls.destroy(); hls = null; } v.pause(); v.removeAttribute('src'); v.load(); }
function fail() { msg('This channel is offline', 'Free streams drop out sometimes. Try another one.', 'Next channel', () => step(1)); }
function play(c) {
  cur = c; stop(); $('msg').hidden = true;
  $('title').textContent = c.name; $('sub').textContent = c.cat + (c.cc ? ' · ' + cname(c.cc) : '') + ' · Live';
  const go = () => v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls(); hls.loadSource(c.url); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, go);
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) fail(); });
  } else if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src = c.url; v.onloadedmetadata = go; v.onerror = fail; }
  else fail();
  document.querySelectorAll('.card').forEach(n => n.classList.remove('on')); render();
}
function step(d) {
  const l = visible(); if (!l.length) return;
  let i = l.findIndex(c => cur && c.url === cur.url); play(l[(i + d + l.length) % l.length]);
}
$('go').onclick = () => { const l = visible().filter(c => c.logo); if (l.length) play(l[Math.floor(Math.random() * l.length)]); };
$('next').onclick = () => step(1); $('prev').onclick = () => step(-1);
$('fs').onclick = () => $('screen').requestFullscreen && $('screen').requestFullscreen();
$('more').onclick = () => { shown += PAGE; render(); };
$('q').oninput = e => { query = e.target.value.toLowerCase(); shown = PAGE; render(); };
$('country').onchange = e => { country = e.target.value; shown = PAGE; render(); };
render();
</script>
</body>
</html>
